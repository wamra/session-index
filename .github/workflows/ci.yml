name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS is left out on purpose: it is the development platform and its
  # hosted runners cost about ten times the Linux rate.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # Cross-builds the six release archives and keeps them for a week.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - run: scripts/build-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: session-index-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Publishes the installable plugin (launcher plus the six binaries) as the orphan "plugin" branch,
  # which the marketplace installs from. Runs for a version tag (git tag v0.1.1 && git push --tags)
  # or by hand, not for every push: with no pinned version, every new plugin commit is an update
  # that every machine downloads (about 90 MB), so docs-only pushes must not publish.
  plugin:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Build and check the plugin tree
        run: |
          v="${GITHUB_SHA::7}"; [ "$GITHUB_REF_TYPE" = tag ] && v="$GITHUB_REF_NAME"
          scripts/build-plugin.sh "$RUNNER_TEMP/plugin" "$v"
          scripts/check-plugin.sh "$RUNNER_TEMP/plugin" "$v"
      - name: Push the plugin branch when it changed
        working-directory: ${{ runner.temp }}/plugin
        run: |
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git init -q -b plugin
          git config user.name "wamra"
          git config user.email "wamra@users.noreply.github.com"
          git add -A
          new=$(git write-tree)
          if git fetch -q --depth 1 "$remote" plugin && [ "$(git rev-parse FETCH_HEAD^{tree})" = "$new" ]; then
            echo "plugin branch already has this tree"; exit 0
          fi
          git commit -q -m "Plugin build of ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push -f "$remote" plugin
