version: 2
project_name: session-index

before:
  hooks:
    - go mod tidy

builds:
  - id: session-index
    main: ./cmd/session-index
    binary: session-index
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - skills/session-search/SKILL.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

# No release or publish block: this config is for local builds
# (goreleaser release --snapshot --clean). Add one when the repo is public.
